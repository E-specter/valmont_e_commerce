[project]
name = "valmont"
version = "0.1.0"
description = "API de comercio electrónico Valmont (FastAPI, arquitectura hexagonal)."
authors = [
    { name = "Especter", email = "especter.o.a@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
